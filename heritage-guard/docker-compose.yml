services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_HERITAGEGUARD_API_URL: ${NEXT_PUBLIC_HERITAGEGUARD_API_URL:-}
    container_name: nextjs-app
    env_file:
      - .env.local
    expose:
      - "3000"
    networks:
      - app-net
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    name: app-net
    driver: bridge
