name: Deploy to Azure

on:
  push:
    branches: [main-azure]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: heritageguardacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg NEXT_PUBLIC_HERITAGEGUARD_API_URL=https://heritageguard.azurewebsites.net \
            -t heritageguardacr.azurecr.io/heritageguard:latest \
            -t heritageguardacr.azurecr.io/heritageguard:${{ github.sha }} .
          docker push heritageguardacr.azurecr.io/heritageguard:latest
          docker push heritageguardacr.azurecr.io/heritageguard:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Web App to pull latest image
        run: az webapp restart --name heritageguard --resource-group heritageguard-rg
